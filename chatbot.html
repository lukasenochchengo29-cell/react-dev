<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.min.js"></script>

    <script type="text/babel">

        return (

          </>

      function ChatMessage({ message, sender }) {

        //const sender = props.sender;
        //const { message, sender } = props;

        /*if (sender === "robot") {
          return (
            <div>
              <img src="robot.png" width="50" />
              {message}
            </div>
          );
        }*/

        return (

            )}

            {sender === "user" && (
              <img src="user.png" width="50" />)}
          </div>
        );
      }
      function ChatMessages()
      {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "hello chatbot",
            sender: "user",
            id:'id1'
          },
        {
          message: "Hello! How can I help you?",
          sender: "robot",
          id:'id2'
        },
        {
          message: "can you get me todays date?",
          sender: "user",
          id:'id3'
        },
        {
          message: "Today is September 27",
          sender: "robot",
          id:'id4'
        }
      ]);
      //const [chatMessages, setChatMessages] = array;// I have to do this because of the way react works. it returns an array with two values, the first is the state variable and the second is a function to update that variable. so i have to destructure the array into two variables.
      // const chatMessages = array[0];
      // const setChatMessages = array[1];

      function sendMessage() {
        setChatMessages([
          ...chatMessages,
          {
            message: "test",
            sender: "user",
            id: crypto.randomUUID()
        }]);
        console.log(chatMessages);
      }
        return (
          <>

          <button onClick={sendMessage}>Send message</button>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }
      function App(){ 
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
