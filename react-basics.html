<!doctype html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.min.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const products = [
        { title: "Cotton socks", id: 1 },
        { title: "Wool socks", id: 2 },
        { title: "Silk socks", id: 3 },
      ];

      // This is now a real React COMPONENT (a function that returns JSX).
      // Capitalized name ("App") is a React convention for components.
      function App() {
        // useState(0) creates a piece of state that starts at 0.
        // cartCount -> current value
        // setCartCount -> the ONLY correct way to update it
        // Calling setCartCount() automatically tells React to re-render this component.
        const [cartCount, setCartCount] = React.useState(0);

        // A second piece of state, just to track the current time
        const [currentTime, setCurrentTime] = React.useState(dayjs().format("HH:mm:ss"));

        // useEffect lets us run "side effects" -- things outside of just
        // returning JSX, like setting up a timer. The empty array [] at the
        // end means "only run this once, when the component first mounts."
        React.useEffect(() => {
          const intervalId = setInterval(() => {
            setCurrentTime(dayjs().format("HH:mm:ss"));
          }, 1000);

          // Cleanup: stop the interval if the component ever unmounts
          return () => clearInterval(intervalId);
        }, []);

        // Handler: runs when an "Add to Cart" button is clicked
        const handleAddToCart = (product) => {
          setCartCount(cartCount + 1);
          console.log(`Added ${product.title} to cart.`);
        };

        // Build the list of <li> items from the products array
        const listItems = products.map((product) => (
          <li key={product.id}>
            {product.title}
            <button onClick={() => handleAddToCart(product)}>
              Add to Cart
            </button>
          </li>
        ));

        // The JSX this component renders
        return (
          <div>
            <p>My name is Lukas Enock Chengo.</p>

            <p>Current Time : {currentTime}</p>

            <ul>{listItems}</ul>

            <p><strong>Cart Total: {cartCount} item(s)</strong></p>
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
